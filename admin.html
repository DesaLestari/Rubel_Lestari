<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Rubel Lestari</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #eef2f5; color: #333; }
        header { background: #1a365d; color: white; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-back { color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 4px; font-size: 14px; }
        .card { background: white; padding: 25px; margin-top: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 10px; margin: 10px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #1a365d; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 15px; }
        button:hover { background: #2a4365; }
    </style>
</head>
<body>

    <header>
        <h2>🔐 Admin Panel</h2>
        <a href="index.html" class="btn-back">← Kembali ke Utama</a>
    </header>

    <div class="card" id="loginCard">
        <h3>Login Pengelola / Tutor</h3>
        <label for="passInput">Masukkan Password Admin:</label>
        <input type="password" id="passInput" placeholder="Password Admin...">
        <button onclick="login()">Masuk Panel</button>
    </div>

    <div class="card" id="adminContent" style="display: none; max-width: 100%;">
        <h3>Selamat Datang, Tutor / Pengelola!</h3>
        <p>Di sini tempat khusus mengelola iuran, catatan siswa, dan data absensi.</p>
    </div>

    <script>
        function login() {
            const pass = document.getElementById('passInput').value;
            if (pass === "RubelLestari2026!") {
                alert("Login Berhasil!");
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
            } else {
                alert("Password Salah! Coba perhatikan huruf kapital dan tanda seru.");
            }
        }
    </script>

</body>
</html>
